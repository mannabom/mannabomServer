
services:
  mannabom-server:
    image: ${IMAGE_URI}:${IMAGE_TAG}
    container_name: mannabom-server
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    env_file:
      - .env
    # 앱이 아직 IP:8080으로 붙는다. 모든 앱이 https://api.mannabom.com 으로 바뀌면 이 포트를 닫는다
    ports:
      - 8080:8080
    depends_on:
      - postgres
      - redis
    networks:
      - mannabom-net
    volumes:
      - /opt/mannabom/firebase:/opt/mannabom/firebase
      - /opt/mannabom/apple-root-ca:/opt/mannabom/apple-root-ca:ro
      - /opt/mannabom/google-play:/opt/mannabom/google-play:ro
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: mannabom-nginx
    ports:
      - 443:443
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/mannabom/nginx:/etc/nginx/certs:ro
    depends_on:
      - mannabom-server
    networks:
      - mannabom-net
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: mannabom-postgres
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - mannabom-net

  redis:
    image: redis:alpine
    container_name: redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - mannabom-net

networks:
  mannabom-net:
    driver: bridge

volumes:
  postgres_data: {}
  redis_data: {}
