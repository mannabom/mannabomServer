# Cloudflare(Full strict) → Nginx(443, Origin 인증서) → mannabom-server:8080
# 인증서는 VM의 /opt/mannabom/nginx/{cert.pem,key.pem} 에 두고 컨테이너에 읽기 전용으로 연결한다.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.mannabom.com;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # spring.servlet.multipart.max-request-size(30MB)와 맞춘다
    client_max_body_size 30m;

    location / {
        proxy_pass http://mannabom-server:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        # Cloudflare가 넣어 주는 실제 사용자 IP. 관리자 API가 X-Forwarded-For 첫 값을 감사 로그에 쓴다
        proxy_set_header X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;

        # /ws-chat 웹소켓(STOMP)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
