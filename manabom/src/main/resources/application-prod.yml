spring:
  application:
    name: mannabom-server

  # AWS RDS PostgreSQL 설정
  datasource:
    url: jdbc:postgresql://${AWS_RDS_ENDPOINT}:${AWS_RDS_PORT:5432}/${AWS_RDS_DATABASE}
    username: ${AWS_RDS_USERNAME}
    password: ${AWS_RDS_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # JPA/Hibernate 설정
  jpa:
    hibernate:
      ddl-auto: validate     # update 사용 (배포용)
      default_batch_fetch_size: 100
    show-sql: false        # SQL 로그 비활성화 (배포용)

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # EC2 Redis 설정 (우선 AWS 전환X)
  data:
    redis:
      host: ${REDIS_HOST}    # EC2 Private IP 또는 localhost (같은 서버인 경우)
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}  # Redis에 비밀번호 설정한 경우

  # 파일 업로드 설정
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

  # 이메일 설정 (우선 AWS 전환X)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# 커스텀 설정
app:
  # JWT 토큰 설정
  jwt:
    secret: ${JWT_SECRET}  #
    access-token-expiration: 86_400_000   # 24시간 (밀리초)
    refresh-token-expiration: 604_800_000 # 7일 (밀리초)

  # 카카오 OAuth 설정 (프로덕션)
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    redirect-uri: ${KAKAO_REDIRECT_URI:https://your-domain.com/api/auth/login/kakao}
    development:
      skip-age-verification: true  # 이거 아직 카카오 디벨로퍼 준비 안되서
      default-birth-year: 2000
      default-gender: "MALE"

  # AWS S3 설정
  aws:
    region: ${AWS_REGION:ap-northeast-2}  # 서울 리전
    s3:
      bucket-name: ${AWS_S3_BUCKET_NAME}
      access-key: ${AWS_ACCESS_KEY_ID}
      secret-key: ${AWS_SECRET_ACCESS_KEY}
      base-url: https://${AWS_S3_BUCKET_NAME}.s3.${AWS_REGION:ap-northeast-2}.amazonaws.com/

  # 이메일 인증 설정
  email:
    dummy-mode: false  # 실제 이메일 발송

# 로깅 설정 (프로덕션)
logging:
  level:
    com.mannabom: INFO          # 배포용은 INFO 레벨
    org.springframework.security: WARN
    org.springframework.web: WARN
  file:
    name: /var/log/mannabom/app.log  # 로그 파일 저장

# 서버 설정
server:
  port: ${SERVER_PORT:8080}

meeting:
  cursor:
    secret: ${MEETING_SECRET_KEY:local-dev-key-do-not-user-in-prod}
  match:
    scheduler:
      initial-delay: 1800000
      fixed_delay: 1800000

#fcm 설정
fcm:
  service-account-path: ${FCM_FILE_PATH:}
  project_id: ${FCM_PROJECT_ID:}
  url: https://fcm.googleapis.com/v1/projects/${fcm.project_id}/messages:send
  google_api: https://www.googleapis.com/auth/cloud-platform

# 운영 정책 설정
match:
  policy:
    cooldown-hours: 72 # 프로필 추천으로 제공된 사용자가 다시 추천으로 뜰 수 있는 최소 시간
    candidate-pool-size: 200 # 추천을 하기 전에 조건에 맞는 사용자 추출(후보군 수)
    pick-pool-size: 50 # 이번 추천 리스트로 뽑을 인원수의 상한(최종 인원수)

ting:
  policy:
    vip-threshold: 200 # VIP로 분류되는 팅 보유 갯수 기준
    cost:
      extra-profile: 5 # 팅을 소모해서 추가적인 프로필 추천을 받을 때 비용(팅 갯수)
      extra-profile-bundle5: 20 # 추가 프로필 5개 묶음 비용
      message: 40 # 팅을 소모해서 메시지를 보낼 때 비용(팅 갯수)
      like: 20 # 팅을 소모해서 호감 보낼 때 사용(팅 갯수)
      view-extra-photo: 5 # 상대 사진 추가로 보기
      view-score: 5 # 상대가 내게 준 점수 조회 비용
      view-liked-me-profile: 5 # 나를 찜한 사람 프로필 보기 (변수 이름을 잘못 지었다 ㅠㅠ 수정 귀찮음,, 헷갈리지 말기)
      view-high-score-profile: 5 # 나에게 높은 점수 준 유저 프로필 조회 비용

benefit:
  policy:
    membership: # 맴버쉽 혜택
      monthly-extra-profiles: 35
      monthly-free-messages: 10
      monthly-free-likes: 5
    vip: # VIP 혜택
      daily-extra-profiles: 2
      daily-free-messages: 0
      daily-free-likes: 0
    basic: # 기본 지급
      daily-profile: 10
      daily-love-view: 10