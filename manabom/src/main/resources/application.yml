spring:
  application:
    name: mannabom-server

  # PostgreSQL DB 설정 (로컬용)
  datasource:
    url: jdbc:postgresql://localhost:5432/mannabom_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  # JPA/Hibernate 설정
  jpa:
    hibernate:
      ddl-auto: validate  # create(DB테스트용), update(개발용), validate(운영용)
      default_batch_fetch_size: 100
    properties:
      hibernate.hibernate.use_sql_comments: true
      hibernate:
        format_sql: true
    show-sql: false  # SQL 쿼리 로그 출력 (개발용)


  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false





  # Redis 설정
  data:
    redis:
      host: localhost
      port: 6379

  # 파일 업로드 설정
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

  # 이메일 설정 (역시 이후 AWS 전환해야)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# 커스텀 설정
app:
  aws:
    region: ${AWS_REGION}
    s3:
      bucket-name: ${S3_BUCKET_NAME}
      access-key: ${S3_ACCESS_KEY}
      secret-key: ${S3_SECRET_KEY}
      base-url: ${S3_BASE_URL}
  # jwt 토큰 설정
  jwt:
    secret: ${JWT_SECRET:mannabom-super-secret-key-for-development-only-change-in-production}  # 32자 이상 필수
    access-token-expiration: 86_400_000   # 24시간 (밀리초)
    refresh-token-expiration: 604_800_000 # 7일 (밀리초)

  # 카카오 OAuth 설정
  kakao:
    client-id: ${KAKAO_CLIENT_ID:your-kakao-client-id}
    redirect-uri: http://localhost:8080/api/auth/login/kakao  # 임시로 카카오 디벨로퍼에 등록한 URI
    # 운영환경에서는 실제 도메인으로 변경 필요
    # redirect-uri: https://company-domain.com/api/auth/login/kakao

    # 사업자 등록 하기 전 임시 개발환경 전용 설정
    development:
      skip-age-verification: true        # 연령검증 스킵
      default-birth-year: 2000          # 더미 출생년도 (24세)
      default-gender: "MALE"            # 더미 성별

  # 파일 저장 설정 (로컬 개발용)
  file:
    upload-dir: ./uploads/                  # 로컬 파일 저장 경로
    base-url: http://localhost:8080/files/  # 파일 접근 URL
    # AWS S3 사용 시 설정 변경 필요

  # 이메일 인증 설정 (로컬 개발용)
  email:
    dummy-mode: false     # false=실제발송, true=콘솔테스트

# 로깅 설정 (개발용)
logging:
  level:
    com.mannabom: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE

# 서버 설정
server:
  port: 8080


# 미팅 리스트 커서 설정
meeting:
  cursor:
    secret: ${MEETING_SECRET_KEY:local-dev-key-do-not-user-in-prod}
  match:
    scheduler:
      initial-delay: 1800000
      fixed_delay: 1800000

#fcm 설정
fcm:
  service-account-path: ${FCM_FILE_PATH:}
  project_id: ${FCM_PROJECT_ID:}
  url: https://fcm.googleapis.com/v1/projects/${fcm.project_id}/messages:send
  google_api: https://www.googleapis.com/auth/cloud-platform

# 운영 정책 설정
match:
  policy:
    cooldown-hours: 72 # 프로필 추천으로 제공된 사용자가 다시 추천으로 뜰 수 있는 최소 시간
    candidate-pool-size: 200 # 추천을 하기 전에 조건에 맞는 사용자 추출(후보군 수)
    pick-pool-size: 50 # 이번 추천 리스트로 뽑을 인원수의 상한(최종 인원수)

ting:
  policy:
    vip-threshold: 200 # VIP로 분류되는 팅 보유 갯수 기준
    cost:
      extra-profile: 5 # 팅을 소모해서 추가적인 프로필 추천을 받을 때 비용(팅 갯수)
      extra-profile-bundle5: 20 # 추가 프로필 5개 묶음 비용
      message: 40 # 팅을 소모해서 메시지를 보낼 때 비용(팅 갯수)
      like: 20 # 팅을 소모해서 호감 보낼 때 사용(팅 갯수)
      view-extra-photo: 5 # 상대 사진 추가로 보기
      view-score: 5 # 상대가 내게 준 점수 조회 비용
      view-liked-me-profile: 5 # 나를 찜한 사람 프로필 보기 (변수 이름을 잘못 지었다 ㅠㅠ 수정 귀찮음,, 헷갈리지 말기)
      view-high-score-profile: 5 # 나에게 높은 점수 준 유저 프로필 조회 비용

benefit:
  policy:
    membership: # 맴버쉽 혜택
      monthly-extra-profiles: 35
      monthly-free-messages: 10
      monthly-free-likes: 5
    vip: # VIP 혜택
      daily-extra-profiles: 2
      daily-free-messages: 0
      daily-free-likes: 0
    basic: # 기본 지급
      daily-profile: 10
      daily-love-view: 10